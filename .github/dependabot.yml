version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # ESLint 9+ requires the flat-config rewrite and eslint-plugin-n8n-nodes-base
      # is still eslintrc-only; stay on 8.x until that plugin supports flat config.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) is outside typescript-eslint v8's peer range;
      # stay on 5.x until the lint toolchain supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
